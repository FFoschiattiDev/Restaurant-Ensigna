<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurante Ensigna · A tavola non s'invecchia: Reservacion de Mesas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,500;0,600;1,500&family=Dancing+Script:wght@600;700&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="../logo.png">
    <link rel="stylesheet" href="EstiloReserva.css">
</head>
<body>

    <!-- ========================================== -->
    <!--        SECCIÓN DE NAVEGACIÓN (NAVBAR)      -->
    <!-- ========================================== -->

<header class="site-header" id="siteHeader">
  <div class="header-inner">
    <a href="../index.html" class="brand">
      <img src="../logo.png" alt="Logo Restaurante Ensigna" class="brand-logo">
      <span class="brand-text">RESTAURANTE<br>ENSIGNA</span>
    </a>

    <nav class="main-nav" id="mainNav">
      <a href="../index.html#historia">Historia</a>
      <a href="../index.html#fotos">Fotos</a>
      <a href="../index.html#menu">Menú</a>
      <a href="../index.html#lugar">Lugar</a>
    </nav>

    <a href="Reserva.html" class="btn-reservar btn-reservar--header">Reservar</a>

    <button class="nav-toggle" id="navToggle" aria-label="Abrir menú" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
  </div>
</header>

    <!-- ========================================== -->
    <!--            SECCIÓN     PRINCIPAL           -->
    <!-- ========================================== -->

    <main class="main-background">

    <!-- Cuadro negro central -->
        <div class="cuadro-negro">
            
            <h1>¡Reserva una Mesa!</h1>
            <p>Haz una reserva en nuestro restaurante para una ocación especial.</p>

            <!-- Formulario conectado a Formspree (ACTION == [Token dada por la página]) -->
            <form id="form-reserva" action="https://formspree.io/f/myewdepq" method="POST">

                <!-- CAMPO 1: Nombre Completo -->
                <div class="campo-grupo">
                    <label for="nombre">Nombre completo</label>
                    <input type="text" id="nombre" name="nombre" placeholder="Escribe tu nombre" required>
                </div>

                <!-- CAMPO 2: Correo Electrónico -->
                <div class="campo-grupo">
                    <label for="email">Correo electrónico</label>
                    <input type="email" id="email" name="email" placeholder="tucorreo@gmail.com" required>
                </div>

                <!-- CAMPO 3: Fecha de la Visita (Mínimo un día después del actual validado con JS) -->
                <div class="campo-grupo">
                    <label for="fecha">Fecha de la visita</label>
                    <input type="date" id="fecha" name="fecha" required>
                </div>

                <!-- CAMPO 4: Cantidad de Invitados (maximos 6) -->
                <div class="campo-grupo">
                    <label for="invitados">Cantidad de invitados</label>
                    <select id="invitados" name="invitados" required>
                        <option value="" disabled hidden selected>Selecciona cantidad del 1 al 6</option>
                        <option value="1">1 persona (Solo tú)</option>
                        <option value="2">2 personas</option>
                        <option value="3">3 personas</option>
                        <option value="4">4 personas</option>
                        <option value="5">5 personas</option>
                        <option value="6">6 personas</option>
                    </select>
                </div>

                <!-- CAMPO 5: Horario de la Visita -->
                <div class="campo-grupo">
                    <label for="hora">Horario de la visita</label>
                    <select id="hora" name="hora" required>
                        <option value="" disabled hidden selected >Selecciona un horario</option>

                        <optgroup label="Turno del mediodía">
                            <option value="09:00">09:00</option>
                            <option value="09:30">09:30</option>
                            <option value="10:00">10:00</option>
                            <option value="10:30">10:30</option>
                            <option value="11:00">11:00</option>
                            <option value="11:30">11:30</option>
                            <option value="12:00">12:00</option>
                            <option value="12:30">12:30</option>
                            <option value="13:00">13:00</option>
                            <option value="13:30">13:30</option>
                            <option value="14:00">14:00</option>
                            <option value="14:30">14:30</option>
                            <option value="15:00">15:00</option>
                            <option value="15:30">15:30</option>
                        </optgroup>

                        <optgroup label="Turno de la noche">
                            <option value="20:00">20:00</option>
                            <option value="20:30">20:30</option>
                            <option value="21:00">21:00</option>
                            <option value="21:30">21:30</option>
                            <option value="22:00">22:00</option>
                            <option value="22:30">22:30</option>
                            <option value="23:00">23:00</option>
                            <option value="23:30">23:30</option>
                        </optgroup>
                    </select>
                </div>

                <!-- CAMPO 6: Teléfono Móvil -->
                <div class="campo-grupo">
                    <label for="telefono">Teléfono móvil</label>
                    <input type="tel" id="telefono" name="telefono" placeholder="Tu teléfono" required>
                </div>

                <!-- CAMPO 7: Checkbox de Consentimiento -->
                <div class="campo-checkbox">
                    <input type="checkbox" id="consentimiento" name="consentimiento" required>
                    <label for="consentimiento">Consiento que toda la información ingresada sea enviada al Gmail de un representante del restaurante y resguardad en una base de datos de terceros.</label>
                </div>

                <!-- Botón Envíar -->
                <button type="submit" id="btn-reservar">RESERVAR</button>

            </form>

        </div>

    </main>


        <!-- ========================================== -->
        <!-- MODAL DE RESERVA COMPLETADA (Oculto por defecto) -->
        <!-- ========================================== -->

    <div id="modal-reserva" class="modal-oculto">
        <div class="modal-contenido">
            <p>RESERVA COMPLETADA</p>
            <button id="btn-cerrar-modal">¡Perfecto!</button>
        </div>
    </div>


    <!-- ========================================== -->
    <!--            ESPACIO DEL FOOTER              -->
    <!-- ========================================== -->

 <section class="info-strip" aria-label="Datos de contacto y horario">
    <div class="info-strip-inner">
      <div class="info-item">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2c-4 0-7 3-7 7 0 5 7 13 7 13s7-8 7-13c0-4-3-7-7-7Zm0 10a3 3 0 1 1 0-6 3 3 0 0 1 0 6Z" fill="currentColor"/></svg>
        <span>Avenida 9 de Julio 6229</span>
      </div>
      <div class="info-item">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M12 7v5l4 2" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        <span>9:00&nbsp;–&nbsp;16:00 · 20:00&nbsp;–&nbsp;00:00</span>
      </div>
      <div class="info-item">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.6 10.8c1.4 2.8 3.8 5.2 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.5 2.3.7 3.6.7.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.6 21 3 13.4 3 4c0-.6.4-1 1-1h3.3c.6 0 1 .4 1 1 0 1.3.2 2.5.7 3.6.1.4.1.8-.2 1.1L6.6 10.8Z" fill="currentColor"/></svg>
        <span>+54 922 412 3451</span>
      </div>
    </div>
  </section>


    <!-- Aquí vincularemos el JavaScript más adelante -->
    <script src="ScriptReserva.js"></script>
</body>
</html>
